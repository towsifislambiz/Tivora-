<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Title & SEO -->
    <title>Tivora — Connect · Share · Grow Together</title>
    <meta name="description" content="Tivora is a modern social platform to connect with friends, share posts, join communities, and grow together." />
    <meta name="keywords" content="Tivora, social network, community, friends, posts, groups, messaging" />
    <meta name="robots" content="index, follow" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0095F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tivora" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tivora.app/" />
    <meta property="og:title" content="Tivora — Connect · Share · Grow Together" />
    <meta property="og:description" content="Tivora is a modern social platform to connect with friends, share posts, join communities, and grow together." />
    <meta property="og:image" content="https://tivora.app/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tivora.app/" />
    <meta name="twitter:title" content="Tivora — Connect · Share · Grow Together" />
    <meta name="twitter:description" content="Tivora is a modern social platform to connect with friends, share posts, join communities, and grow together." />
    <meta name="twitter:image" content="https://tivora.app/og-image.png" />

    <!-- Google Fonts (preconnect for performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-brand-bg text-brand-mainText antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
